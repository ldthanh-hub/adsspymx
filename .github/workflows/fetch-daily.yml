name: Fetch Meta Ad Library (Mexico) hàng ngày

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 07:00 giờ Mexico City (UTC-6, chưa tính DST)
  workflow_dispatch: {} # cho phép bấm chạy tay để test trước khi tin tưởng lịch tự động

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Cài dependencies
        run: npm install

      - name: Áp dụng cấu trúc database mới nhất (an toàn, chạy lại nhiều lần không mất dữ liệu)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chạy job fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_COUNTRY: MX
        run: npm run fetch

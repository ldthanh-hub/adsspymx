name: Fetch tín hiệu ngoài Meta (Google Trends, Mercado Libre, TikTok)

# Lịch: 14:00 UTC = 08:00 giờ Mexico City — chạy SAU job Meta (13:00 UTC) 1 tiếng để tránh
# 2 job cùng lúc. workflow_dispatch để bấm chạy tay test trước khi tin lịch tự động.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Nguồn cần kéo (all = cả 3)"
        required: false
        default: "all"
        type: choice
        options: [all, tiktok, mercado, trends]
      brand:
        description: "Chỉ kéo 1 brand (để trống = cả 11 brand)"
        required: false
        default: ""

jobs:
  fetch-signals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Cài dependencies
        run: npm install

      # migrate chạy schema.sql idempotent — tạo bảng tiktok_hashtags, mercado_listings,
      # google_trends, signal_runs nếu chưa có, không xóa dữ liệu cũ.
      - name: Áp dụng cấu trúc database mới nhất
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      # Chỉ Mercado fallback mới cần Chromium; cài sẵn cho mọi lần chạy để khỏi fail giữa chừng.
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chạy job kéo tín hiệu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:signals -- --source=${{ inputs.source || 'all' }} ${{ inputs.brand && format('--brand={0}', inputs.brand) || '' }}

name: Quét 1 từ khóa theo yêu cầu (thủ công)

# Chạy TAY khi cần tra 1 từ khóa/thương hiệu CHƯA có trong danh sách theo dõi thường xuyên
# (server/src/config/keywords.js) — xem README mục "Quét 1 từ khóa theo yêu cầu" để có hướng dẫn
# từng bước bằng hình. KHÔNG chạy theo lịch tự động (khác với fetch-daily.yml).
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Từ khóa hoặc tên thương hiệu cần quét (VD: Seyoul, rutina skincare, Zara Home...)"
        required: true
        type: string
      country:
        description: "Thị trường cần quét"
        required: true
        type: choice
        default: "MX"
        options:
          - MX
          - US
      category:
        description: "Ngành hàng (tuỳ chọn — chỉ để phân loại/hiển thị, để trống nếu không chắc)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "Mỹ phẩm & Làm đẹp"
          - "Thời trang"
          - "Đồ gia dụng"

jobs:
  fetch-one:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Cài dependencies
        run: npm install

      - name: Áp dụng cấu trúc database mới nhất (an toàn, chạy lại nhiều lần không mất dữ liệu)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Quét từ khóa được yêu cầu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCAN_KEYWORD: ${{ github.event.inputs.keyword }}
          SCAN_COUNTRY: ${{ github.event.inputs.country }}
          SCAN_CATEGORY: ${{ github.event.inputs.category }}
        run: npm run fetch:one
